<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAI62 | Interactive Final Exam Study Guide</title><style>
:root{--navy:#172742;--blue:#315de4;--teal:#0c887c;--bg:#f4f7fc;--line:#dbe3f0;--muted:#52647e}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--navy)}header{background:linear-gradient(115deg,#172742,#274c9b);color:white;padding:28px max(22px,calc((100vw - 1250px)/2))}header h1{font-size:clamp(25px,3.1vw,39px);margin:4px 0}header p{margin:4px 0;color:#e1e9ff}.byline{font-weight:750;color:#fff!important;letter-spacing:.3px}.layout{max-width:1250px;margin:25px auto;display:grid;grid-template-columns:270px 1fr;gap:22px;padding:0 20px}aside{align-self:start;position:sticky;top:15px;background:white;border:1px solid var(--line);border-radius:16px;padding:16px}aside h3{margin:0 0 14px}.nav{display:block;text-align:left;width:100%;border:1px solid transparent;border-radius:11px;padding:12px;margin:5px 0;background:transparent;color:var(--navy);font:inherit;cursor:pointer}.nav:hover{background:#eef2ff}.nav.active{background:#e7eeff;border-color:#b6c7ff;font-weight:700}.small{font-size:13px;color:var(--muted)}.pill{display:inline-block;border-radius:40px;padding:3px 9px;background:#e6f6f1;color:#0a6759;font-size:12px;font-weight:750}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:clamp(18px,3vw,32px);margin-bottom:20px;box-shadow:0 5px 25px #142c5910}h2{font-size:clamp(23px,2.7vw,31px);line-height:1.2;margin:0 0 10px}h3{margin:18px 0 10px}h4{margin:10px 0}.intro{font-size:18px;color:var(--muted)}.terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.term{border:1px solid #dce5f3;border-left:4px solid #5a7bf4;border-radius:10px;padding:13px;background:#fafcff}.term b{display:block}.term span{font-size:14px;color:#455872}pre{background:#14233d;color:#e9f3ff;overflow:auto;padding:18px;border-radius:12px;font:14px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}button{font:inherit;cursor:pointer}button.primary{background:#315de4;color:white;border:0;border-radius:11px;padding:11px 20px;font-weight:700}button.secondary{background:#fff;border:1px solid #b7c8e9;color:#264578;border-radius:11px;padding:10px 16px;font-weight:700}button:disabled{opacity:.5;cursor:default}.demo{background:#eef5ff;border:1px solid #cbdcfb;border-radius:14px;padding:16px}.demo input,.demo select{border:1px solid #b8c9e0;border-radius:8px;padding:9px;font-size:16px;max-width:190px}.demo label{display:inline-flex;flex-direction:column;font-weight:700;gap:5px;margin:5px 10px 5px 0}.demo-output{padding:12px;background:white;border:1px solid #cbdcfb;border-radius:10px;margin-top:10px;min-height:50px}.qtop{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}.question{font-size:19px;font-weight:650;white-space:pre-wrap;margin:14px 0 18px}.option{width:100%;display:flex;align-items:flex-start;gap:14px;text-align:left;border:2px solid #d9e2f0;background:#fff;border-radius:12px;margin:10px 0;padding:14px;color:var(--navy)}.option:hover:not(:disabled){border-color:#6d8ef5;background:#f8faff}.option .letter{background:#e7edff;color:#274ba8;border-radius:9px;min-width:30px;text-align:center;padding:2px;font-weight:800}.option .content{white-space:pre-wrap;overflow-wrap:anywhere;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:14px;line-height:1.55}.option.wrong{border-color:#ef9d9d;background:#fff2f2}.option.correct{border-color:#44ae89;background:#ecfaf3}.feedback{border-radius:12px;padding:15px;margin:16px 0;background:#fff7e6;border-left:5px solid #e2a134}.feedback.good{background:#eaf9f0;border-color:#26a56e}.feedback.bad{background:#fff1f0;border-color:#db655e}.progress{height:12px;background:#e1e8f4;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:#25a47f;transition:width .25s}.controls{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:20px}.visual{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:12px 0}.node{border:2px solid #aac2ec;border-radius:10px;padding:12px;background:white;text-align:center;min-width:100px}.arrow{font-weight:900;color:#3b67ce;font-size:23px}.muted{color:var(--muted)}.checklist{padding:0;list-style:none}.checklist li{padding:6px 0}.checklist li:before{content:'✓';color:#13966f;margin-right:10px}.done{color:#0c8b69}.diagram{width:100%;max-width:640px;height:auto}.footer{padding:28px;text-align:center;color:#586b83}.badge{background:#e9efff;color:#264ca5;border-radius:50px;padding:4px 11px;font-size:13px;font-weight:700}.welcome{font-size:17px}.navsmall{font-size:13px;display:block;color:#60738d}details{background:#f3f7ff;padding:12px;border-radius:10px;margin:12px 0}summary{cursor:pointer;font-weight:700}@media(max-width:790px){.layout{display:block;padding:0 12px}aside{position:static;margin-bottom:18px}aside .nav{display:inline-block;width:auto;font-size:13px;margin:3px;padding:8px}.panel{padding:17px}.option .content{font-size:12px}}
</style></head><body><header><div class="badge">CAI62 • Term 1 • Milestone 3</div><h1>Interactive Final Exam Study Guide</h1><p>SQL Server + WPF Desktop Applications • 30 original practice questions</p><p class="byline">Created by Mazin Yousif</p></header><div class="layout"><aside><h3>📚 Study Topics</h3><div id="nav"></div><hr style="border:0;border-top:1px solid #e2e9f4"><b>Overall progress</b><div class="progress" style="margin:10px 0"><div id="allbar"></div></div><div class="small" id="allcount"></div><button class="secondary" style="margin-top:14px;width:100%" onclick="resetProgress()">Restart all practice</button></aside><main id="main"></main></div><div class="footer">CAI62 • Study, visualize, practice, and learn from mistakes. • Created by Mazin Yousif</div>
<script>const DATA={"lessons": [{"title": "SQL Foundations & Filtering", "nums": [1, 3, 24], "icon": "database", "summary": "Create databases, select columns, filter rows, and sort results.", "terms": [["Database", "A place that stores related tables."], ["CREATE DATABASE", "Makes a new database."], ["USE", "Chooses which database receives your commands."], ["SELECT", "Chooses columns to display."], ["WHERE", "Keeps rows that meet a condition."], ["ORDER BY", "Sorts the result; ASC means low to high and DESC means high to low."]], "example": "CREATE DATABASE ServiceDB;\nGO\nUSE ServiceDB;\nGO\n\nSELECT ProductName, Price\nFROM Products\nWHERE Price > 50\nORDER BY Price DESC;", "sim": "sql"}, {"title": "SQL Totals, Joins & Reports", "nums": [9, 15, 20, 26, 29], "icon": "chart-column-increasing", "summary": "Combine tables, calculate totals, and find groups that match a condition.", "terms": [["JOIN", "Connects matching rows from two tables."], ["LEFT JOIN", "Keeps every row from the left table, even without a match."], ["SUM", "Adds numbers."], ["COUNT(column)", "Counts non-NULL values in that column."], ["GROUP BY", "Puts rows into groups for calculations."], ["HAVING", "Filters grouped results after totals are calculated."], ["TOP (3)", "Keeps only three rows."]], "example": "SELECT CustomerID, SUM(Charge) AS Total\nFROM Jobs\nWHERE Status = 'Completed'\nGROUP BY CustomerID\nHAVING SUM(Charge) > 1000;", "sim": "group"}, {"title": "Database Relationships & Safe Data", "nums": [5, 13, 17, 23, 28], "icon": "network", "summary": "Understand primary keys, foreign keys, importing CSV files, and deletion rules.", "terms": [["Primary key (PK)", "A unique ID for a row."], ["Foreign key (FK)", "A column that refers to a key in another table."], ["3NF", "A table design that reduces repeated information and unwanted dependencies."], ["ON DELETE CASCADE", "Deleting a parent also deletes its related children."], ["NO ACTION", "Blocks a parent deletion if it would break related records."], ["CSV import", "Moves rows from a CSV file into a table."]], "example": "Products(ProductID PK, ProductName, SupplierID FK)\nSuppliers(SupplierID PK, SupplierName, SupplierPhone)\n\n-- Import Suppliers before Products\n-- when Products has a supplier foreign key.", "sim": "relation"}, {"title": "SQL Changes & Commands", "nums": [12, 18, 16, 25], "icon": "database-zap", "summary": "Update or delete only the intended rows and check what the database changed.", "terms": [["UPDATE", "Changes existing rows."], ["DELETE", "Removes rows."], ["AND", "Both conditions must be true."], ["WHERE", "Limits which rows are changed."], ["Parameter", "A safe placeholder such as @id for an input value."], ["ExecuteNonQuery", "Runs INSERT, UPDATE or DELETE; its result can report affected rows."]], "example": "UPDATE Orders\nSET OrderStatus = 'Completed'\nWHERE OrderID = 410 AND OrderStatus = 'Pending';\n\nDELETE FROM Products WHERE ProductID = 990;", "sim": "update"}, {"title": "WPF Interface & XAML", "nums": [2, 6, 8, 14], "icon": "layout-dashboard", "summary": "Build clear forms with labels, text boxes, choices, and helpful messages.", "terms": [["WPF", "Windows Presentation Foundation: a framework for desktop apps."], ["XAML", "Markup that describes the user interface."], ["TextBlock", "Displays a label or text."], ["TextBox", "Lets the user type."], ["StackPanel", "Places controls vertically or horizontally."], ["Tab order", "The order keyboard focus moves when Tab is pressed."], ["SelectedIndex = -1", "Removes a ComboBox selection without deleting choices."]], "example": "<StackPanel Orientation=\"Vertical\">\n  <TextBlock Text=\"Equipment Name\"/>\n  <TextBox x:Name=\"txtEquipmentName\"/>\n<\/StackPanel>", "sim": "form"}, {"title": "WPF Data & SQL Connections", "nums": [4, 10, 11, 22, 30], "icon": "cable", "summary": "Connect a WPF app to SQL Server and show database records in a DataGrid.", "terms": [["SqlConnection", "Connects C# code to SQL Server."], ["Open()", "Opens a connection before using it."], ["using", "Disposes an object when the block ends."], ["SqlDataAdapter.Fill", "Loads query results into a DataTable."], ["DataTable", "Holds rows and columns in memory."], ["ItemsSource", "Tells a DataGrid which data to display."], ["DataContext", "Sets the object used as a source for WPF bindings."]], "example": "using (SqlConnection connection = new SqlConnection(connectionString))\n{\n    connection.Open();\n    LoadJobs(connection);\n}\n\nDataTable table = new DataTable();\nadapter.Fill(table);\ndgProducts.ItemsSource = table.DefaultView;", "sim": "pipeline"}, {"title": "Validation & Safe User Actions", "nums": [7, 19, 21, 27], "icon": "shield-check", "summary": "Check inputs, confirm destructive actions, and stop invalid saves.", "terms": [["Validation", "Checking whether user input is acceptable."], ["IsNullOrWhiteSpace", "True for empty text or text containing only spaces."], ["TryParse", "Attempts to turn text into a number without crashing."], ["return", "Stops the current method."], ["MessageBox", "Shows a message or asks for confirmation."], ["YesNo", "Lets a user approve or cancel an action."]], "example": "if (string.IsNullOrWhiteSpace(txtName.Text))\n{\n    MessageBox.Show(\"Enter an equipment name.\");\n    return;\n}", "sim": "validate"}], "questions": [{"n": 1, "stem": "A repair company needs a new SQL Server database named ServiceDB. It must become the active \ndatabase before tables are created. ServiceDB does not yet exist.  \n \nWhich SSMS script meets both requirements?", "options": {"A": "CREATE DATABASE ServiceDB; \nGO \nUSE master; \nGO", "B": "USE ServiceDB; \nGO \nCREATE DATABASE ServiceDB; \nGO", "C": "CREATE DATABASE ServiceDB; \nGO \nUSE ServiceDB; \nGO", "D": "CREATE DATABASE ServiceDB; \nGO \nUSE tempdb; \nGO"}, "correct": "C", "lesson": 0, "explanation": "CREATE DATABASE makes ServiceDB, then USE ServiceDB selects it. The order matters.", "hint": "Think about the two actions: first create, then select."}, {"n": 2, "stem": "A stock-control employee enters records using the keyboard. Pressing Tab moves from Product \nName directly to Delete, skipping Price and Quantity. Which change most directly improves keyboard \nusability?", "options": {"A": "Disable keyboard focus on all input fields.", "B": "Make Delete the first focusable control on every form.", "C": "Set a logical tab order from Product Name to Price to Quantity, then to the action buttons.", "D": "Keep the tab order and increase the window width."}, "correct": "C", "lesson": 4, "explanation": "Tab should move logically through input fields before action buttons.", "hint": "Follow the order in which a person normally fills in a form."}, {"n": 3, "stem": "A warehouse needs only ProductName and Quantity for products with fewer than 10 units, \nincluding zero. Sort the results by Quantity from lowest to highest, then ProductID from lowest to \nhighest.  \nWhich query meets all requirements?", "options": {"A": "SELECT ProductName, Quantity FROM Products \nWHERE Quantity > 0 AND Quantity < 10 \nORDER BY Quantity, ProductID;", "B": "SELECT ProductName, Quantity FROM Products \nWHERE Quantity <= 10 ORDER BY Quantity, ProductID;", "C": "SELECT ProductName, Quantity FROM Products \nWHERE Quantity < 10 ORDER BY Quantity DESC, ProductID;", "D": "SELECT ProductName, Quantity FROM Products \nWHERE Quantity < 10 ORDER BY Quantity, ProductID;"}, "correct": "D", "lesson": 0, "explanation": "Quantity < 10 includes zero and excludes ten. ORDER BY Quantity, ProductID sorts both ascending.", "hint": "Does the filter include zero? Does it exclude ten? Check the sorting direction."}, {"n": 4, "stem": "A WPF service application must create a SQL connection, explicitly open it before calling \nLoadJobs(connection), and dispose of it afterwards. connectionString is valid.  \nWhich segment meets all requirements?", "options": {"A": "using (SqlConnection connection = new SqlConnection(connectionString)) \n{ \n    connection.Open(); \n    LoadJobs(connection); \n}", "B": "using (SqlConnection connection = new SqlConnection(connectionString)) \n{ \n    connection.Open(); \n    connection.Close(); \n    LoadJobs(connection); \n}", "C": "SqlConnection connection = new SqlConnection(connectionString); \nconnection.Open(); \nLoadJobs(connection);", "D": "using (SqlConnection connection = new SqlConnection(connectionString)) \n{ \n    LoadJobs(connection); \n    connection.Open(); \n}"}, "correct": "A", "lesson": 5, "explanation": "The using block disposes the connection; Open comes before LoadJobs.", "hint": "Find a block that opens before loading and automatically cleans up."}, {"n": 5, "stem": "An importer must load Categories.csv and Products.csv into empty tables. Products.CategoryID is a \nnon-null foreign key to Categories.CategoryID. The cleaned files contain valid unique keys and every \nproduct references a category in Categories.csv.  \nWhich sequence preserves the enabled foreign key?", "options": {"A": "Import Products.csv and replace every CategoryID with zero.", "B": "Import Products.csv, then Categories.csv.", "C": "Import Categories.csv, then Products.csv.", "D": "Import Categories.csv and remove CategoryID from every product before importing."}, "correct": "C", "lesson": 2, "explanation": "Categories are parent records. Import them before Products so foreign keys can match.", "hint": "A child row cannot refer to a parent that does not exist yet."}, {"n": 6, "stem": "An equipment registration screen needs the Equipment Name label above an editable TextBox that \nC# can access as txtEquipmentName.  \nWhich XAML fragment meets all requirements?", "options": {"A": "<StackPanel Orientation=\"Vertical\" IsEnabled=\"False\"> \n  <TextBlock Text=\"Equipment Name\"/> \n  <TextBox x:Name=\"txtEquipmentName\"/> \n<\/StackPanel>", "B": "<StackPanel Orientation=\"Vertical\"> \n  <TextBlock Text=\"Equipment Name\"/> \n  <TextBox x:Name=\"txtEquipmentName\"/> \n<\/StackPanel>", "C": "<StackPanel Orientation=\"Horizontal\"> \n  <TextBlock Text=\"Equipment Name\"/> \n  <TextBox x:Name=\"txtEquipmentName\"/> \n<\/StackPanel>", "D": "<StackPanel Orientation=\"Vertical\"> \n  <TextBlock Text=\"Equipment Name\"/> \n  <TextBox x:Name=\"txtEquipmentName\" IsReadOnly=\"True\"/> \n<\/StackPanel>"}, "correct": "B", "lesson": 4, "explanation": "Vertical StackPanel places the label above the editable, named TextBox.", "hint": "Check vertical placement, the TextBox name, and whether editing is allowed."}, {"n": 7, "stem": "A repair form must reject an equipment name that is empty or consists only of spaces. Invalid \ninput must show a warning and stop the current Save handler. Which segment works?", "options": {"A": "if (txtName.Text.Length == 0) \n{ \n    MessageBox.Show(\"Enter an equipment name.\"); \n    return; \n}", "B": "if (string.IsNullOrWhiteSpace(txtName.Text)) \n{ \n    MessageBox.Show(\"Enter an equipment name.\"); \n    return; \n}", "C": "if (string.IsNullOrEmpty(txtName.Text)) \n{ \n    MessageBox.Show(\"Enter an equipment name.\"); \n    return; \n}", "D": "if (string.IsNullOrWhiteSpace(txtName.Text)) \n{ \n    MessageBox.Show(\"Enter an equipment name.\"); \n    txtName.Clear(); \n}"}, "correct": "B", "lesson": 6, "explanation": "IsNullOrWhiteSpace catches empty text and spaces; return stops saving.", "hint": "A user might enter three spaces instead of letters."}, {"n": 8, "stem": "A WPF order form has a non-editable ComboBox with several delivery choices. Clear must empty \ntxtReference and remove the selection without deleting those choices.  \nWhich segment works?", "options": {"A": "txtReference.Clear(); \ncmbDelivery.SelectedIndex = 0;", "B": "txtReference.Clear(); \ncmbDelivery.IsEnabled = false;", "C": "txtReference.Clear(); \ncmbDelivery.SelectedIndex = -1;", "D": "txtReference.Clear(); \ncmbDelivery.Items.Clear();"}, "correct": "C", "lesson": 4, "explanation": "SelectedIndex = -1 clears only the selection. Items stay available.", "hint": "Clearing a selection is different from deleting the choices."}, {"n": 9, "stem": "A retailer stores Products(ProductID, CategoryID) and OrderLines(OrderID, ProductID, Quantity, \nUnitPrice). All values are non-null; Quantity is int and UnitPrice is decimal(10,2). Revenue means \nQuantity multiplied by the unit price stored on each order line.  \nWhich query gives total revenue for each category that has sales?", "options": {"A": "SELECT p.CategoryID, SUM(ol.UnitPrice) AS Revenue \nFROM Products p JOIN OrderLines ol ON p.ProductID = ol.ProductID \nGROUP BY p.CategoryID;", "B": "SELECT p.CategoryID, SUM(ol.Quantity * ol.UnitPrice) AS Revenue \nFROM Products p JOIN OrderLines ol ON p.ProductID = ol.ProductID \nGROUP BY p.CategoryID;", "C": "SELECT p.CategoryID, COUNT(*) AS Revenue \nFROM Products p JOIN OrderLines ol ON p.ProductID = ol.ProductID \nGROUP BY p.CategoryID;", "D": "SELECT p.CategoryID, SUM(ol.Quantity * ol.UnitPrice) AS Revenue \nFROM Products p JOIN OrderLines ol ON p.ProductID = ol.ProductID \nGROUP BY p.CategoryID, ol.OrderID;"}, "correct": "B", "lesson": 1, "explanation": "Revenue per order line is Quantity × UnitPrice; SUM and GROUP BY CategoryID produce totals.", "hint": "One sale line can contain more than one unit."}, {"n": 10, "stem": "A WPF inventory application has a SqlDataAdapter named adapter configured with a valid SELECT \nquery and connection. The DataGrid should display the retrieved rows. Which segment fills a DataTable \nbefore assigning its view?", "options": {"A": "DataTable table = new DataTable(); \ndgProducts.ItemsSource = table.DefaultView;", "B": "DataTable table = new DataTable(); \nadapter.Fill(table); \ndgProducts.ItemsSource = table.DefaultView;", "C": "DataTable table = new DataTable(); \nadapter.Update(table); \ndgProducts.ItemsSource = table.DefaultView;", "D": "DataTable table = new DataTable(); \nadapter.Fill(table); \ndgProducts.ItemsSource = null;"}, "correct": "B", "lesson": 5, "explanation": "Fill(table) retrieves rows; DefaultView makes them visible in the DataGrid.", "hint": "A new empty table does not yet contain query results."}, {"n": 11, "stem": "MainWindow has an initialized public property Products.  \nIts DataGrid uses ItemsSource=\"{Binding Products}\" and inherits the window DataContext.  \nWhich constructor makes the window itself the binding source?", "options": {"A": "public MainWindow() \n{ \n    InitializeComponent(); \n    DataContext = this; \n}", "B": "public MainWindow() \n{ \n    InitializeComponent(); \n    DataContext = Products; \n}", "C": "public MainWindow() \n{ \n    InitializeComponent(); \n    DataContext = new Product(); \n}", "D": "public MainWindow() \n{ \n    InitializeComponent(); \n    DataContext = null; \n}"}, "correct": "A", "lesson": 5, "explanation": "DataContext = this makes MainWindow the source of its Products property.", "hint": "What object owns the Products property?"}, {"n": 12, "stem": "A delivery company must mark only OrderID 410 as Completed, and only if it is currently Pending.  \nWhich statement meets the requirement for every possible set of orders?", "options": {"A": "UPDATE Orders SET OrderStatus = 'Completed' \nWHERE OrderID = 410 OR OrderStatus = 'Pending';", "B": "UPDATE Orders SET OrderStatus = 'Completed' \nWHERE OrderID = 410 AND OrderStatus = 'Completed';", "C": "UPDATE Orders SET OrderStatus = 'Completed' \nWHERE OrderID = 410 AND OrderStatus = 'Pending';", "D": "UPDATE Orders SET OrderStatus = 'Completed' \nWHERE OrderStatus = 'Pending';"}, "correct": "C", "lesson": 3, "explanation": "AND requires both OrderID 410 and Pending status before updating.", "hint": "Both the ID and the old status must match."}, {"n": 13, "stem": "A supplier file contains 120 cleaned records with unique SupplierIDs. Its destination table was \nempty, and the import reports 118 inserted rows and 2 rejected rows. What should the developer do \nbefore declaring the import complete?", "options": {"A": "Accept the import because most records were inserted.", "B": "Copy any two existing rows to bring the table count to 120.", "C": "Disable the primary key and import the entire file again.", "D": "Inspect the rejected rows and import log, resolve the cause, then reconcile imported keys and \ncounts against the source."}, "correct": "D", "lesson": 2, "explanation": "Two rejected rows mean the import is incomplete; investigate errors and compare counts and keys.", "hint": "A successful import must account for every expected source row."}, {"n": 14, "stem": "A maintenance application saves a job successfully but gives no visible feedback. Employees \nrepeatedly click Save because they are unsure whether it worked.  \nWhich interface change most directly addresses this uncertainty?", "options": {"A": "Replace the Save label with a shorter label.", "B": "Increase the window width without changing feedback.", "C": "Move the Save button above the input fields.", "D": "Show a clear Job saved message after a successful save."}, "correct": "D", "lesson": 4, "explanation": "A visible success message tells the employee that saving worked.", "hint": "Users need confirmation that their action succeeded."}, {"n": 15, "stem": "A wholesaler needs the three highest-selling products by total units sold. OrderLines contains \nProductID and positive integer Quantity. Return exactly three rows when at least three products have \nsales; break ties using the smaller ProductID first. Which SQL Server query meets the requirement?", "options": {"A": "SELECT TOP (3) ProductID, SUM(Quantity) AS Units \nFROM OrderLines GROUP BY ProductID \nORDER BY Units DESC, ProductID ASC;", "B": "SELECT TOP (3) ProductID, Quantity AS Units \nFROM OrderLines ORDER BY Quantity DESC, ProductID ASC;", "C": "SELECT TOP (3) ProductID, COUNT(*) AS Units \nFROM OrderLines GROUP BY ProductID \nORDER BY Units DESC, ProductID ASC;", "D": "SELECT TOP (3) ProductID, SUM(Quantity) AS Units \nFROM OrderLines GROUP BY ProductID \nORDER BY Units ASC, ProductID ASC;"}, "correct": "A", "lesson": 1, "explanation": "SUM(Quantity) totals units by product; descending sorting finds the biggest totals; ProductID breaks ties.", "hint": "Count of order lines is not the same as total units sold."}, {"n": 16, "stem": "A technician changes one selected product price. connection is open; selectedId is its integer \nProductID and price is a validated decimal. cmd has already been constructed with connection.  \nWhich segment updates only that product, binds both values and executes the update?", "options": {"A": "cmd.CommandText = \"UPDATE Products SET Price=@price WHERE ProductID=@id\"; \ncmd.Parameters.Add(\"@price\", SqlDbType.Decimal).Value = price; \ncmd.Parameters[\"@price\"].Precision = 10; \ncmd.Parameters[\"@price\"].Scale = 2; \ncmd.Parameters.Add(\"@id\", SqlDbType.Int).Value = selectedId; \ncmd.ExecuteNonQuery();", "B": "cmd.CommandText = \"UPDATE Products SET Price=@price WHERE ProductID=@id\"; \ncmd.Parameters.Add(\"@price\", SqlDbType.Decimal).Value = price; \ncmd.Parameters[\"@price\"].Precision = 10; \ncmd.Parameters[\"@price\"].Scale = 2; \ncmd.Parameters.Add(\"@id\", SqlDbType.Int).Value = selectedId; \n// The command is not executed.", "C": "cmd.CommandText = \"UPDATE Products SET Price=@price\"; \ncmd.Parameters.Add(\"@price\", SqlDbType.Decimal).Value = price; \ncmd.Parameters[\"@price\"].Precision = 10; \ncmd.Parameters[\"@price\"].Scale = 2; \ncmd.Parameters.Add(\"@id\", SqlDbType.Int).Value = selectedId; \ncmd.ExecuteNonQuery();", "D": "cmd.CommandText = \"UPDATE Products SET Price=@price WHERE CategoryID=@id\"; \ncmd.Parameters.Add(\"@price\", SqlDbType.Decimal).Value = price; \ncmd.Parameters[\"@price\"].Precision = 10; \ncmd.Parameters[\"@price\"].Scale = 2; \ncmd.Parameters.Add(\"@id\", SqlDbType.Int).Value = selectedId; \ncmd.ExecuteNonQuery();"}, "correct": "A", "lesson": 3, "explanation": "A parameterized UPDATE with WHERE ProductID=@id and ExecuteNonQuery updates the selected row.", "hint": "Look for the product ID filter, parameter values, and execution call."}, {"n": 17, "stem": "A product CSV repeats supplier names and phone numbers. The dependency diagram shows all \nrelevant functional dependencies; ProductID is the only candidate key in the original relation.  \nWhich decomposition removes the transitive dependency and produces a suitable 3NF design?", "options": {"A": "Products(ProductID PK, ProductName, SupplierID FK) \nSuppliers(SupplierID PK, SupplierName, SupplierPhone)", "B": "Products(ProductID PK, ProductName, SupplierID, SupplierName, SupplierPhone)", "C": "Products(ProductID PK, ProductName, SupplierID, SupplierName) \nSuppliers(SupplierID PK, SupplierPhone)", "D": "Products(ProductID PK, ProductName) \nSuppliers(SupplierID PK, SupplierName, SupplierPhone) \n// No relationship records which supplier supplies each product."}, "correct": "A", "lesson": 2, "explanation": "Supplier details depend on SupplierID, not ProductID directly. Put them in Suppliers and keep SupplierID as a foreign key in Products.", "hint": "Which attributes describe the supplier rather than the product?"}, {"n": 18, "stem": "An inventory test record has ProductID 990 and is not referenced by any foreign keys. Which \nstatement removes only that record?", "options": {"A": "DELETE FROM Products;", "B": "DELETE FROM Products WHERE ProductID = 990;", "C": "DELETE FROM Products WHERE Quantity = 0;", "D": "UPDATE Products SET Quantity = 0 WHERE ProductID = 990;"}, "correct": "B", "lesson": 3, "explanation": "DELETE with WHERE ProductID=990 removes only that matching record.", "hint": "Without WHERE, a DELETE can remove many records."}, {"n": 19, "stem": "A repair form accepts a decimal service fee greater than zero. It must warn and return for text, \nzero or a negative value. Which segment validates every case?", "options": {"A": "if (!decimal.TryParse(txtFee.Text, out decimal fee) || fee <= 0) \n{ \n    MessageBox.Show(\"Invalid fee.\"); \n    return; \n}", "B": "if (decimal.TryParse(txtFee.Text, out decimal fee) && fee > 0) \n{ \n    MessageBox.Show(\"Invalid fee.\"); \n    return; \n}", "C": "if (!decimal.TryParse(txtFee.Text, out decimal fee) || fee < 0) \n{ \n    MessageBox.Show(\"Invalid fee.\"); \n    return; \n}", "D": "if (!decimal.TryParse(txtFee.Text, out decimal fee) && fee <= 0) \n{ \n    MessageBox.Show(\"Invalid fee.\"); \n    return; \n}"}, "correct": "A", "lesson": 6, "explanation": "TryParse rejects nonnumbers; fee <= 0 rejects zero and negative fees. OR catches either problem.", "hint": "Test text, zero, and negative numbers separately."}, {"n": 20, "stem": "A repair company stores Jobs(CustomerID, Charge, Status). It needs one row per customer whose \ntotal Charge for Completed jobs exceeds AED 1000. Which query correctly filters individual jobs before \ncalculating and filtering each customer total?", "options": {"A": "SELECT CustomerID, SUM(Charge) AS TotalCharge \nFROM Jobs WHERE Status = 'Completed' \nGROUP BY CustomerID, Charge HAVING SUM(Charge) > 1000;", "B": "SELECT CustomerID, SUM(Charge) AS TotalCharge \nFROM Jobs WHERE Charge > 1000 AND Status = 'Completed' \nGROUP BY CustomerID;", "C": "SELECT CustomerID, SUM(Charge) AS TotalCharge \nFROM Jobs GROUP BY CustomerID \nHAVING SUM(Charge) > 1000;", "D": "SELECT CustomerID, SUM(Charge) AS TotalCharge \nFROM Jobs WHERE Status = 'Completed' \nGROUP BY CustomerID HAVING SUM(Charge) > 1000;"}, "correct": "D", "lesson": 1, "explanation": "WHERE keeps Completed jobs before grouping; HAVING keeps customers whose total is above 1000.", "hint": "WHERE works before GROUP BY; HAVING works after grouping."}, {"n": 21, "stem": "A repair application stores jobs in an ObservableCollection<Job>. selected is the selected Job. \nWhich segment removes only this job and only after the user chooses Yes?", "options": {"A": "if (MessageBox.Show(\"Delete job?\", \"Confirm\", \n    MessageBoxButton.YesNo) == MessageBoxResult.No) \n{ \n    Jobs.Remove(selected); \n}", "B": "if (MessageBox.Show(\"Delete job?\", \"Confirm\", \n    MessageBoxButton.YesNo) == MessageBoxResult.Yes) \n{ \n    Jobs.Remove(selected); \n}", "C": "if (MessageBox.Show(\"Delete job?\", \"Confirm\", \n    MessageBoxButton.YesNo) == MessageBoxResult.Yes) \n{ \n    Jobs.Clear(); \n}", "D": "Jobs.Remove(selected); \nMessageBox.Show(\"Delete job?\", \"Confirm\", MessageBoxButton.YesNo);"}, "correct": "B", "lesson": 6, "explanation": "Only when the user chooses Yes should Jobs.Remove(selected) run.", "hint": "Only remove the selected object after confirmation."}, {"n": 22, "stem": "A WPF stock application has validated input and prepared a parameterized INSERT command \ncmd. Assume execution inserts one row successfully.  \nWhich segment inserts the record, then reports success and reloads the product grid, in that order?", "options": {"A": "cmd.ExecuteNonQuery(); \nMessageBox.Show(\"Product added.\"); \ndgProducts.ItemsSource = null;", "B": "MessageBox.Show(\"Product added.\"); \nLoadProducts();", "C": "LoadProducts(); \ncmd.ExecuteNonQuery(); \nMessageBox.Show(\"Product added.\");", "D": "cmd.ExecuteNonQuery(); \nMessageBox.Show(\"Product added.\"); \nLoadProducts();"}, "correct": "D", "lesson": 5, "explanation": "Execute the INSERT first, show success second, and reload the grid last.", "hint": "A success message should come after the database operation succeeds."}, {"n": 23, "stem": "A document system uses Files.FolderID referencing Folders.FolderID with ON DELETE CASCADE. \nFolder 7 contains FileIDs 31 and 32; folder 8 contains FileID 33. With no other dependencies,  \nwhat happens after DELETE FROM Folders WHERE FolderID = 7?", "options": {"A": "Only folder 7 is deleted; files 31 and 32 remain.", "B": "Folder 7 and files 31 and 32 are deleted; folder 8 and file 33 remain.", "C": "All three files are deleted.", "D": "The statement is rejected because folder 7 has files."}, "correct": "B", "lesson": 2, "explanation": "ON DELETE CASCADE removes related files 31 and 32 when folder 7 is deleted, but not folder 8 or file 33.", "hint": "Follow the relationship from folder to files."}, {"n": 24, "stem": "A purchasing report must display only ProductName and Price for products costing more than \nAED 50, with the highest prices first. Which query works?", "options": {"A": "SELECT ProductName, Price FROM Products \nWHERE Price > 50 ORDER BY Price DESC;", "B": "SELECT * FROM Products \nWHERE Price > 50 ORDER BY Price DESC;", "C": "SELECT ProductName, Price FROM Products \nWHERE Price > 50 ORDER BY Price ASC;", "D": "SELECT ProductName, Price FROM Products \nWHERE Price >= 50 ORDER BY Price DESC;"}, "correct": "A", "lesson": 0, "explanation": "SELECT picks exactly ProductName and Price; WHERE Price > 50 filters; DESC sorts high to low.", "hint": "Check the selected columns, strict comparison, and descending sort."}, {"n": 25, "stem": "A parameterized update targets one ProductID primary key. SQL Server uses SET NOCOUNT OFF \nand the table has no triggers. cmd.ExecuteNonQuery() returns 0 without throwing an exception.  \nWhich message is accurate?", "options": {"A": "A new product was inserted automatically.", "B": "The database connection must have failed.", "C": "Product updated successfully.", "D": "No product matched the requested ID; refresh the list and check the selection."}, "correct": "D", "lesson": 3, "explanation": "Zero affected rows means no matching product was updated under the question’s assumptions.", "hint": "Zero rows affected is not the same as an exception."}, {"n": 26, "stem": "Products contains non-null ProductIDs and nullable CategoryID values. A NULL CategoryID means \nnot yet assigned and is allowed. Before enabling a foreign key, a developer must find only non-null \nCategoryIDs with no match in Categories.  \nWhich query works?", "options": {"A": "SELECT p.ProductID, p.CategoryID \nFROM Products p LEFT JOIN Categories c ON p.CategoryID = c.CategoryID \nWHERE p.CategoryID IS NOT NULL AND c.CategoryID IS NULL;", "B": "SELECT p.ProductID, p.CategoryID \nFROM Products p LEFT JOIN Categories c ON p.CategoryID = c.CategoryID \nWHERE c.CategoryID IS NOT NULL;", "C": "SELECT p.ProductID, p.CategoryID \nFROM Products p JOIN Categories c ON p.CategoryID = c.CategoryID \nWHERE c.CategoryID IS NULL;", "D": "SELECT p.ProductID, p.CategoryID \nFROM Products p LEFT JOIN Categories c ON p.CategoryID = c.CategoryID \nWHERE c.CategoryID IS NULL;"}, "correct": "A", "lesson": 1, "explanation": "LEFT JOIN finds missing matches; exclude NULL Product.CategoryID values because those are allowed.", "hint": "Missing category matches have NULL values on the right side of a LEFT JOIN."}, {"n": 27, "stem": "An open SQL connection and parameterized DELETE command cmd are ready for the selected \nProductID. Assume deletion succeeds when executed.  \nWhich segment requests confirmation first, deletes only for Yes, then reloads the grid?", "options": {"A": "cmd.ExecuteNonQuery(); \nif (MessageBox.Show(\"Delete product?\", \"Confirm\", \n    MessageBoxButton.YesNo) == MessageBoxResult.Yes) \n{ \n    LoadProducts(); \n}", "B": "if (MessageBox.Show(\"Delete product?\", \"Confirm\", \n    MessageBoxButton.YesNo) == MessageBoxResult.Yes) \n{ \n    cmd.ExecuteNonQuery(); \n    LoadProducts(); \n}", "C": "if (MessageBox.Show(\"Delete product?\", \"Confirm\", \n    MessageBoxButton.YesNo) == MessageBoxResult.No) \n{ \n    cmd.ExecuteNonQuery(); \n    LoadProducts(); \n}", "D": "if (MessageBox.Show(\"Delete product?\", \"Confirm\", \n    MessageBoxButton.YesNo) == MessageBoxResult.Yes) \n{ \n    LoadProducts(); \n    cmd.ExecuteNonQuery(); \n}"}, "correct": "B", "lesson": 6, "explanation": "Ask Yes/No first; if Yes, execute DELETE and then refresh the grid.", "hint": "The database change must occur after Yes and before refreshing."}, {"n": 28, "stem": "A supplier table is referenced by Products.SupplierID using ON DELETE NO ACTION. Supplier 4 still \nhas two products. The company must retain those product records with valid supplier links.  \nWhat happens if it directly deletes supplier 4?", "options": {"A": "Only one product is deleted and supplier 4 remains.", "B": "Supplier 4 and both products are automatically deleted.", "C": "The deletion is rejected; dependent products must first be handled consistently with the business \nrequirement.", "D": "Supplier 4 is deleted and both product links become NULL."}, "correct": "C", "lesson": 2, "explanation": "NO ACTION prevents deletion of a supplier still referenced by products.", "hint": "What happens when a referenced parent is protected by NO ACTION?"}, {"n": 29, "stem": "A customer-service report must show every customer, including those with no orders, and their \nnumber of orders. Customers.CustomerID and Orders.OrderID are non-null primary keys.  \nWhich query reports zero for customers without orders?", "options": {"A": "SELECT c.CustomerID, COUNT(*) AS OrderCount \nFROM Customers c LEFT JOIN Orders o ON c.CustomerID = o.CustomerID \nGROUP BY c.CustomerID;", "B": "SELECT c.CustomerID, COUNT(o.OrderID) AS OrderCount \nFROM Customers c LEFT JOIN Orders o ON c.CustomerID = o.CustomerID \nWHERE o.OrderID IS NOT NULL GROUP BY c.CustomerID;", "C": "SELECT c.CustomerID, COUNT(o.OrderID) AS OrderCount \nFROM Customers c JOIN Orders o ON c.CustomerID = o.CustomerID \nGROUP BY c.CustomerID;", "D": "SELECT c.CustomerID, COUNT(o.OrderID) AS OrderCount \nFROM Customers c LEFT JOIN Orders o ON c.CustomerID = o.CustomerID \nGROUP BY c.CustomerID;"}, "correct": "D", "lesson": 1, "explanation": "LEFT JOIN includes customers without orders; COUNT(o.OrderID) returns zero for unmatched rows.", "hint": "COUNT(*) counts the unmatched left-join row too."}, {"n": 30, "stem": "A WPF customer search must retrieve records whose CustomerName matches the entered text \nusing SQL equality (=). The query and open connection are prepared below. The input is validated as at \nmost 80 characters. Which completion binds the actual input, retrieves the rows and displays them? \n \nstring sql = \"SELECT CustomerID, CustomerName FROM Customers \" \n           + \"WHERE CustomerName=@name\"; \n// cmd is a new SqlCommand(sql, connection), disposed by its \nenclosing using block.", "options": {"A": "cmd.Parameters.Add(\"@name\", SqlDbType.NVarChar, 80).Value = \"txtSearch.Text\"; \nusing (SqlDataAdapter adapter = new SqlDataAdapter(cmd)) \n{ \n    DataTable table = new DataTable(); \n    adapter.Fill(table); \n    dgCustomers.ItemsSource = table.DefaultView; \n}", "B": "cmd.Parameters.Add(\"@name\", SqlDbType.NVarChar, 80).Value = txtSearch.Text; \nusing (SqlDataAdapter adapter = new SqlDataAdapter(cmd)) \n{ \n    DataTable table = new DataTable(); \n    dgCustomers.ItemsSource = table.DefaultView; \n}", "C": "cmd.Parameters.Add(\"@name\", SqlDbType.NVarChar, 80).Value = txtSearch.Text; \nusing (SqlDataAdapter adapter = new SqlDataAdapter(cmd)) \n{ \n    DataTable table = new DataTable(); \n    adapter.Fill(table); \n    dgCustomers.ItemsSource = table.DefaultView; \n}", "D": "cmd.Parameters.Add(\"@name\", SqlDbType.NVarChar, 80).Value = txtSearch.Text; \nusing (SqlDataAdapter adapter = new SqlDataAdapter(cmd)) \n{ \n    DataTable table = new DataTable(); \n    adapter.Fill(table); \n    dgCustomers.ItemsSource = null; \n}"}, "correct": "C", "lesson": 5, "explanation": "Bind txtSearch.Text as a value, Fill a DataTable, then assign DefaultView to ItemsSource.", "hint": "Quotation marks around a control expression change it into literal text."}]};
const lessons=DATA.lessons, questions=DATA.questions;const KEY='cai62_m3_study_v1';let completed=new Set();try{completed=new Set(JSON.parse(localStorage.getItem(KEY)||'[]'))}catch(e){};let lessonIndex=-1, questionIndex=0, attempts=0, wrongOptions=new Set(), answered=false;
// Randomized on each load/refresh, not just rotated letter labels.
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};const optionOrders={};questions.forEach(q=>optionOrders[q.n]=shuffle(Object.keys(q.options)));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem(KEY,JSON.stringify([...completed]))}catch(e){}}
function renderNav(){let html='<button class="nav '+(lessonIndex<0?'active':'')+'" onclick="home()">🏠 Start here</button>';lessons.forEach((l,i)=>{let count=l.nums.filter(n=>completed.has(n)).length;html+=`<button class="nav ${lessonIndex===i?'active':''}" onclick="showLesson(${i})">${i+1}. ${esc(l.title)}<span class="navsmall">${count}/${l.nums.length} questions completed</span></button>`});$('nav').innerHTML=html;$('allbar').style.width=(completed.size/30*100)+'%';$('allcount').textContent=`${completed.size} of 30 questions completed`}
function home(){lessonIndex=-1;renderNav();$('main').innerHTML=`<section class="panel"><h2>Welcome to your visual study guide 👋</h2><p class="welcome">Learn SQL Server and WPF step by step. Each topic starts with <b>simple explanations</b>, shows a <b>worked example</b>, and gives you a <b>visual experiment</b> before the exam questions.</p><div class="visual"><div class="node">📖 Learn</div><div class="arrow">→</div><div class="node">👀 See</div><div class="arrow">→</div><div class="node">🧪 Try</div><div class="arrow">→</div><div class="node">🎯 Practice</div></div><ul class="checklist"><li>30 questions from your CAI62 Milestone 3 practice PDF</li><li>Unlimited attempts: mistakes help you learn</li><li>Hints after each incorrect choice</li><li>Choices shuffle whenever you open or refresh this file</li><li>Progress is saved in this browser when supported</li></ul><p class="muted">Topics are grouped by skill, so original question numbers may not appear in numerical order.</p><button class="primary" onclick="showLesson(0)">Start Lesson 1 →</button></section>`}
function showLesson(i){lessonIndex=i;questionIndex=0;attempts=0;answered=false;renderNav();const l=lessons[i];$('main').innerHTML=`<section class="panel"><div class="badge">Lesson ${i+1} of ${lessons.length}</div><h2 style="margin-top:14px">${esc(l.title)}</h2><p class="intro">${esc(l.summary)}</p><h3>1. Learn the important words</h3><div class="terms">${l.terms.map(([a,b])=>`<div class="term"><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join('')}</div><h3>2. Read the example</h3><pre>${esc(l.example)}</pre><h3>3. See it in action</h3><div class="demo" id="sim"></div><h3>4. Check your understanding</h3><p>Try the related questions. You can keep trying until you find the right answer.</p><div class="progress"><div style="width:${l.nums.filter(n=>completed.has(n)).length/l.nums.length*100}%"></div></div><p class="small">${l.nums.length} questions in this topic: ${l.nums.map(n=>'Q'+n).join(', ')}</p><button class="primary" onclick="startPractice()">Practice this topic →</button></section>`;renderSim(l.sim)}
function renderSim(type){let d=$('sim');if(type==='sql'){d.innerHTML=`<p><b>Mini SQL filter:</b> Select a minimum price and watch which products appear.</p><label>Price greater than <input id="price" type="number" value="50" oninput="simSQL()"></label><div id="simout" class="demo-output"></div>`;simSQL()}
else if(type==='group'){d.innerHTML=`<p><b>Group and SUM:</b> Add the completed job charges for each customer.</p><div class="visual"><div class="node">Customer 1<br>400 + 750</div><div class="arrow">→</div><div class="node">SUM = 1150</div><div class="arrow">→</div><div class="node">HAVING > 1000<br>✓ Keep</div></div><label>Minimum total <input id="minTotal" type="number" value="1000" oninput="simGroup()"></label><div id="simout" class="demo-output"></div>`;simGroup()}
else if(type==='relation'){d.innerHTML=`<p><b>Foreign key:</b> Products refer to categories. Choose which parent records exist.</p><div class="visual"><div class="node">Categories<br>ID 1, ID 2</div><div class="arrow">← FK</div><div class="node">Products<br>CategoryID = ?</div></div><label>Product CategoryID<select id="fk" onchange="simFK()"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></label><div id="simout" class="demo-output"></div>`;simFK()}
else if(type==='update'){d.innerHTML=`<p><b>WHERE prevents accidental changes.</b> Choose a product ID to delete in this simulation (no real database is changed).</p><label>Delete ProductID<select id="delid" onchange="simDelete()"><option value="990">990</option><option value="991">991</option></select></label><div id="simout" class="demo-output"></div>`;simDelete()}
else if(type==='form'){d.innerHTML=`<p><b>Try a WPF-style form:</b> Fill the fields, then press Clear.</p><label>Product Name<input id="fName" value="Keyboard"></label><label>Price<input id="fPrice" value="80"></label><label>Quantity<input id="fQty" value="4"></label><label>Delivery<select id="fDelivery"><option value="">Choose</option><option>Pickup</option><option>Courier</option></select></label><p><button class="secondary" onclick="clearForm()">Clear form</button></p><div id="simout" class="demo-output">Tab moves between input controls.</div>`}
else if(type==='pipeline'){d.innerHTML=`<p><b>Follow the data:</b> Click each stage to understand how SQL results appear in WPF.</p><div class="visual">${['Open connection','Fill DataTable','Set ItemsSource','Display DataGrid'].map((s,i)=>`<button class="secondary" onclick="pipeline(${i})">${i+1}. ${s}</button>`).join('')}</div><div id="simout" class="demo-output">Select a step above.</div>`}
else if(type==='validate'){d.innerHTML=`<p><b>Test validation:</b> Try an empty name, spaces, and a real name.</p><label>Equipment name<input id="nameCheck" placeholder="Try spaces" oninput="simValidate()"></label><div id="simout" class="demo-output"></div>`;simValidate()}}
function simSQL(){let v=Number($('price').value),a=[['Mouse',30],['Keyboard',80],['Monitor',350],['Cable',50]].filter(x=>x[1]>v).sort((a,b)=>b[1]-a[1]);$('simout').innerHTML=`<b>SELECT ... WHERE Price > ${esc(v)} ORDER BY Price DESC</b><br>${a.length?a.map(x=>`${esc(x[0])}: AED ${x[1]}`).join('<br>'):'No matching rows'}`}
function simGroup(){let v=Number($('minTotal').value);$('simout').innerHTML=`Customer 1 total: AED 1150 → ${1150>v?'✅ Included':'❌ Excluded'}<br>Customer 2 total: AED 600 → ${600>v?'✅ Included':'❌ Excluded'}<br><small>HAVING SUM(Charge) > ${esc(v)}</small>`}
function simFK(){$('simout').textContent=['1','2'].includes($('fk').value)?'✅ Valid reference: the parent category exists.':'❌ Foreign key violation: CategoryID 3 does not exist.'}
function simDelete(){$('simout').innerHTML=`Products before: <b>990, 991, 992</b><br>DELETE WHERE ProductID = ${esc($('delid').value)}<br>Products after: <b>${[990,991,992].filter(n=>n!=Number($('delid').value)).join(', ')}</b>`}
function clearForm(){['fName','fPrice','fQty'].forEach(id=>$(id).value='');$('fDelivery').selectedIndex=0;$('simout').textContent='✅ Inputs cleared; delivery options still exist.'}
function pipeline(i){$('simout').textContent=['Open(): the SQL connection is ready.','adapter.Fill(table): database rows are copied into a DataTable.','dgProducts.ItemsSource = table.DefaultView: the grid receives the data.','DataGrid: users can see rows and columns on screen.'][i]}
function simValidate(){let v=$('nameCheck').value;$('simout').textContent=v.trim()?'✅ Valid name. Save can continue.':'⚠️ Empty or spaces only. Show a warning and return.'}

function choose(i){if(answered)return;let l=lessons[lessonIndex],q=questions.find(x=>x.n===l.nums[questionIndex]),k=optionOrders[q.n][i],button=$('opt'+i);attempts++;if(k===q.correct){answered=true;completed.add(q.n);save();button.classList.add('correct');document.querySelectorAll('.option').forEach(x=>x.disabled=true);$('feedback').innerHTML=`<div class="feedback good"><b>✅ Well done! You found the correct answer.</b><p>${esc(q.explanation)}</p><p class="small">${attempts===1?'Correct on your first attempt!':`You solved it after ${attempts} attempts. Persistence helps you learn.`}</p></div>`;$('next').style.display='inline-block';renderNav()}else{wrongOptions.add(k);button.classList.add('wrong');button.disabled=true;let extra=attempts>=2?`<p><b>Think again:</b> ${esc(q.explanation.replace(/\b[A-D]\. /g,''))}</p>`:''; // explanations may contain the principle; never reveal answer letter
$('feedback').innerHTML=`<div class="feedback bad"><b>Not quite — try again! 🌱</b><p><b>Hint:</b> ${esc(q.hint)}</p>${attempts>=2?`<p>Compare each remaining choice with the lesson example. Look for every required step.</p>`:''}</div>`}}
